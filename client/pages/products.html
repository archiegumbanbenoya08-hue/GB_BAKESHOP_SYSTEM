<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - GB Bakeshop</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="logo">GB Bakeshop</div>
    </header>
    <aside class="sidebar">
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="products.html" class="active">Products</a></li>
            <li><a href="inventory.html">Inventory</a></li>
            <li><a href="orders.html">Orders</a></li>
        </ul>
    </aside>
    <main>
        <div class="container">
            <h2>Product Management</h2>
            <div class="form-group">
                <input type="text" id="productSearch" placeholder="🔍 Search products..." />
            </div>
            <a id="addProductBtn" class="btn secondary">+ Add New Product</a>
            <section>
            <table id="productsTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            </section>
        </div>
    </main>

    <!-- add product modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Product</h3>
                <span class="modal-close" id="modalClose">&times;</span>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <div class="form-group">
                        <label for="pName">Name</label>
                        <input type="text" id="pName" required>
                    </div>
                    <div class="form-group">
                        <label for="pCategory">Category</label>
                        <input type="text" id="pCategory" required>
                    </div>
                    <div class="form-group">
                        <label for="pPrice">Price</label>
                        <input type="number" id="pPrice" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="pStock">Stock</label>
                        <input type="number" id="pStock" required>
                    </div>
                    <button type="submit" class="btn">Save</button>
                </form>
            </div>
        </div>
    </div>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
