<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - GB Bakeshop</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="logo">GB Bakeshop</div>
    </header>
    <aside class="sidebar">
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="inventory.html">Inventory</a></li>
            <li><a href="orders.html" class="active">Orders</a></li>
        </ul>
    </aside>
    <main>
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Order Management</h2>
                <button id="addOrderBtn" class="btn" style="padding: 10px 20px; font-size: 0.9em;">➕ New Order</button>
            </div>
            <div class="form-group">
                <input type="text" id="orderSearch" placeholder="🔍 Search orders..." />
            </div>
            <section>
            <table id="ordersTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Staff</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            </section>
        </div>
    </main>

    <!-- Order Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New Order</h3>
                <button id="orderModalClose" style="background: none; border: none; font-size: 1.5em; cursor: pointer; color: #333;">&times;</button>
            </div>
            <div class="modal-body">
                <form id="orderForm">
                    <div class="form-group">
                        <label>Staff Member</label>
                        <select id="staffSelect" required>
                            <option value="">-- Select Staff --</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Products (Click to add items)</label>
                        <div id="productList" style="max-height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; padding: 10px;">
                            <p style="color: #999;">Loading products...</p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>📋 Order Items</label>
                        <div id="orderItems" style="border: 1px solid #ddd; border-radius: 8px; padding: 10px; min-height: 60px; background: #f9f9f9;">
                            <p style="color: #999; margin: 0;">No items added yet</p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Total Amount: <strong id="orderTotal">₱0.00</strong></label>
                    </div>

                    <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">Create Order</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Order Detail Modal -->
    <div class="modal" id="orderDetailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Order Details</h3>
                <span class="modal-close" id="orderDetailClose">&times;</span>
            </div>
            <div class="modal-body" id="orderDetailBody">
                <!-- populated by JS -->
            </div>
        </div>
    </div>

    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        // auto-refresh orders every 15 seconds
        setInterval(() => {
            loadOrders().catch(err => console.error('Error refreshing orders:', err));
        }, 15000);
    </script>
</body>
</html>
